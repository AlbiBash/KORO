<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KORO concept B, Day and Night</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concept.css">
<style>
/* B. The collection splits by mood: light peach studio shots by day, dark material shots by night */
.split { display: grid; grid-template-columns: 1fr 1fr; height: 100svh; min-height: 620px; position: relative; }
.split > div { position: relative; overflow: hidden; }
.split img { width: 100%; height: 100%; object-fit: cover; }
.split .day img { object-position: 50% 45%; }
.split .bar { position: absolute; inset: 0 0 auto; z-index: 2; color: var(--ink); }
.split .bar nav:last-child { color: #efe5dc; }
.split .label { position: absolute; top: 96px; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; }
.split .day .label { left: var(--gutter); }
.split .night .label { right: var(--gutter); color: #efe5dc; }
.split h1 { position: absolute; z-index: 2; left: 50%; top: 84%; transform: translate(-50%, -50%); margin: 0; font-size: clamp(56px, 10vw, 160px); line-height: 1; letter-spacing: .1em; white-space: nowrap;
  background: linear-gradient(90deg, var(--ink) 50%, #efe5dc 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tabs { display: flex; justify-content: center; gap: 0; padding: 56px var(--gutter) 40px; }
.tabs button { font: 400 12px var(--sans); letter-spacing: .2em; text-transform: uppercase; padding: 14px 32px; border: 1px solid var(--ink); background: none; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 0 0 2px; }
.grid a { position: relative; }
.grid img { width: 100%; aspect-ratio: 4/5; object-fit: cover; }
.grid span { position: absolute; left: 20px; bottom: 16px; font: 400 22px var(--didot); letter-spacing: .06em; font-variation-settings: "opsz" 28; }
.grid .dark span { color: #efe5dc; }
.edition { display: grid; grid-template-columns: 1fr 1fr; background: var(--mauve); color: #f3e9e2; }
.edition img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1; }
.edition div { align-self: center; padding: clamp(40px, 7vw, 110px); }
.edition h2 { font-size: clamp(36px, 4.4vw, 64px); line-height: 1.02; margin: 12px 0 20px; }
@media (max-width: 760px) {
  .split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .split h1 { top: 50%; background: linear-gradient(180deg, var(--ink) 50%, #efe5dc 50%); -webkit-background-clip: text; background-clip: text; font-size: 64px; }
  .split .bar nav:last-child { color: var(--ink); }
  .split .night .label { right: auto; left: var(--gutter); }
  .grid { grid-template-columns: 1fr 1fr; }
  .grid span { font-size: 17px; left: 12px; bottom: 10px; }
  .edition { grid-template-columns: 1fr; }
}
</style></head><body>
<section class="split">
  <div class="bar"><nav><a>Menu</a></nav><a class="logo" aria-hidden="true" style="visibility:hidden">KORO</a><nav><a>Basket (0)</a></nav></div>
  <div class="day"><img src="../assets/img/koro-olwen.jpg" alt=""><span class="label">By day</span></div>
  <div class="night"><img src="../assets/img/tease-chocolate.jpg" alt=""><span class="label">By night</span></div>
  <h1 class="didot">KORO</h1>
</section>
<div class="tabs" role="group" aria-label="Filter by mood"><button aria-pressed="true">All ten</button><button aria-pressed="false">Day</button><button aria-pressed="false">Night</button></div>
<section class="grid">
  <a><img src="../assets/img/koro-cephir.jpg" alt=""><span>CEPHIR</span></a>
  <a><img src="../assets/img/koro-olwen.jpg" alt=""><span>OLWEN</span></a>
  <a class="dark"><img src="../assets/img/tease-bark.jpg" alt=""><span>BOREALA</span></a>
  <a><img src="../assets/img/koro-sadhana.jpg" alt=""><span>SADHANA</span></a>
  <a class="dark"><img src="../assets/img/tease-chocolate.jpg" alt=""><span>BAHAAT</span></a>
  <a><img src="../assets/img/koro-laudan.jpg" alt=""><span>LAUDAN</span></a>
  <a><img src="../assets/img/koro-saraha.jpg" alt=""><span>SARAHA</span></a>
  <a><img src="../assets/img/koro-oranges.jpg" alt=""><span>AMRITA</span></a>
</section>
<section class="edition">
  <img src="../assets/img/koro-stones.jpg" alt="" style="object-position:50% 80%">
  <div><p class="cap">Season · Autumn 26</p><h2 class="didot">KORO × Nadya Danylenko</h2><p>Our autumn perfume arrives with five original watercolours, as cards or framed prints.</p><a class="btn">Discover the edition</a></div>
</section>
<span class="tag">Concept B · Day &amp; Night</span>
</body></html>
