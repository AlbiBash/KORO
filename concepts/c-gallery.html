<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KORO concept C, Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concept.css">
<style>
/* C. Art and object as equals: a gallery wall where Nadya's drawings hang beside the bottles */
body { background: #ece6dc; }
.intro { text-align: center; padding: clamp(40px,6vw,80px) var(--gutter) clamp(32px,4vw,56px); }
.intro h1 { font-size: clamp(44px, 7vw, 112px); line-height: .98; margin: 14px 0 0; text-wrap: balance; }
.wall { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: clamp(60px, 7vw, 110px); gap: clamp(10px, 1.4vw, 20px); padding: 0 var(--gutter) clamp(64px,8vw,120px); max-width: 1480px; margin: 0 auto; }
.wall figure { margin: 0; position: relative; overflow: hidden; }
.wall img { width: 100%; height: 100%; object-fit: cover; }
.wall figcaption { position: absolute; left: 14px; bottom: 12px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
.w1 { grid-column: 1 / 6; grid-row: 1 / 8; }
.w2 { grid-column: 6 / 9; grid-row: 1 / 5; background: #f7f2ea; padding: 7%; }
.w2 img { object-fit: contain; box-shadow: 0 16px 30px -18px rgba(0,0,0,.45); }
.w3 { grid-column: 9 / 13; grid-row: 1 / 5; }
.w4 { grid-column: 6 / 10; grid-row: 5 / 10; }
.w5 { grid-column: 10 / 13; grid-row: 5 / 8; background: #f7f2ea; padding: 8%; }
.w5 img { object-fit: contain; }
.w6 { grid-column: 1 / 6; grid-row: 8 / 10; display: flex; flex-direction: column; justify-content: center; padding: 0 8%; background: var(--mauve); color: #f3e9e2; }
.w6 p.didot { font-size: clamp(22px, 2.2vw, 32px); line-height: 1.2; margin: 0 0 10px; }
.w7 { grid-column: 10 / 13; grid-row: 8 / 10; }
.w2 figcaption, .w5 figcaption { color: var(--ink-soft); text-shadow: none; bottom: 8px; }
@media (max-width: 760px) {
  .wall { grid-template-columns: repeat(6, 1fr); grid-auto-rows: 64px; }
  .w1 { grid-column: 1 / 7; grid-row: 1 / 8; }
  .w2 { grid-column: 1 / 4; grid-row: 8 / 12; }
  .w3 { grid-column: 4 / 7; grid-row: 8 / 12; }
  .w4 { grid-column: 1 / 7; grid-row: 12 / 19; }
  .w5 { grid-column: 1 / 4; grid-row: 19 / 23; }
  .w7 { grid-column: 4 / 7; grid-row: 19 / 23; }
  .w6 { grid-column: 1 / 7; grid-row: 23 / 26; }
}
</style></head><body>
<div class="bar"><nav><a class="hide-m">Perfumes</a><a class="hide-m">Art</a><a>Menu</a></nav><a class="logo">KORO</a><nav><a>Basket (0)</a></nav></div>
<header class="intro"><p class="cap">Autumn 26 · An exhibition in scent</p><h1 class="didot">KORO × Nadya Danylenko</h1></header>
<section class="wall">
  <figure class="w1"><img src="../assets/img/koro-stones.jpg" alt="" style="object-position:50% 82%"><figcaption>MABON · Autumn 26</figcaption></figure>
  <figure class="w2"><img src="../assets/img/card-dancers.jpg" alt=""><figcaption>No. I · Two, in motion</figcaption></figure>
  <figure class="w3"><img src="../assets/img/koro-cephir.jpg" alt=""><figcaption>CEPHIR</figcaption></figure>
  <figure class="w4"><img src="../assets/img/tease-chocolate.jpg" alt=""><figcaption>BAHAAT</figcaption></figure>
  <figure class="w5"><img src="../assets/img/card-embrace.jpg" alt=""><figcaption>No. II · Embrace</figcaption></figure>
  <div class="w6"><p class="didot">“Natural perfume has complex, voluminous, sensual molecules.”</p><span class="cap">Julia Koro · Perfumer</span></div>
  <figure class="w7"><img src="../assets/img/tease-bark.jpg" alt=""><figcaption>BOREALA</figcaption></figure>
</section>
<span class="tag">Concept C · Gallery</span>
</body></html>
