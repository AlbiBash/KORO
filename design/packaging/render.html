<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #888; }
  .scene { display: block; }
  .didot { font-family: "Bodoni Moda", serif; font-variation-settings: "opsz" 28; }
  .sans { font-family: "Jost", sans-serif; }
</style>
</head>
<body>
<div id="out"></div>
<script>
// ---------- shared defs ----------
const DEFS = `
<defs>
  <linearGradient id="gold" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#7d5e27"/><stop offset=".16" stop-color="#cfae66"/>
    <stop offset=".3" stop-color="#f7e9bd"/><stop offset=".44" stop-color="#c9a056"/>
    <stop offset=".68" stop-color="#94702f"/><stop offset=".84" stop-color="#e0c47f"/>
    <stop offset="1" stop-color="#76571f"/>
  </linearGradient>
  <linearGradient id="goldTop" x1="0" x2="1">
    <stop offset="0" stop-color="#b8924a"/><stop offset=".4" stop-color="#f4e3b0"/><stop offset="1" stop-color="#a47b35"/>
  </linearGradient>
  <linearGradient id="glassFront" x1="0" x2="1">
    <stop offset="0" stop-color="#9c8f6c" stop-opacity=".45"/>
    <stop offset=".07" stop-color="#fffaf0" stop-opacity=".28"/>
    <stop offset=".5" stop-color="#fffaf0" stop-opacity=".08"/>
    <stop offset=".93" stop-color="#fffaf0" stop-opacity=".22"/>
    <stop offset="1" stop-color="#8a7c58" stop-opacity=".5"/>
  </linearGradient>
  <linearGradient id="liquid" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#e9d08c"/><stop offset=".55" stop-color="#d4a94f"/><stop offset="1" stop-color="#b98232"/>
  </linearGradient>
  <linearGradient id="liquidEdge" x1="0" x2="1">
    <stop offset="0" stop-color="#7a4f14" stop-opacity=".45"/><stop offset=".12" stop-color="#7a4f14" stop-opacity="0"/>
    <stop offset=".88" stop-color="#7a4f14" stop-opacity="0"/><stop offset="1" stop-color="#7a4f14" stop-opacity=".5"/>
  </linearGradient>
  <linearGradient id="glassBase" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#e9c977" stop-opacity=".75"/><stop offset=".35" stop-color="#fff6df" stop-opacity=".55"/>
    <stop offset="1" stop-color="#cdb27a" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#e2d6bf"/><stop offset="1" stop-color="#d6c7aa"/>
  </linearGradient>
  <radialGradient id="wallLight" cx=".3" cy=".25" r=".8">
    <stop offset="0" stop-color="#fff8ea" stop-opacity=".55"/><stop offset="1" stop-color="#fff8ea" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#cdb999"/><stop offset="1" stop-color="#c2ab86"/>
  </linearGradient>
  <linearGradient id="kraftFront" x1="0" x2="1">
    <stop offset="0" stop-color="#c39d70"/><stop offset=".55" stop-color="#b48d62"/><stop offset="1" stop-color="#9f7a51"/>
  </linearGradient>
  <linearGradient id="kraftTop" x1="0" x2="1">
    <stop offset="0" stop-color="#d4b285"/><stop offset="1" stop-color="#c3a175"/>
  </linearGradient>
  <linearGradient id="kraftInside" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#6e5034"/><stop offset="1" stop-color="#8f6d48"/>
  </linearGradient>
  <filter id="paper" x="0" y="0" width="1" height="1">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .18  0 0 0 .22 0" result="g"/>
    <feComposite in="g" in2="SourceAlpha" operator="in" result="gn"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gn"/></feMerge>
  </filter>
  <filter id="kraft" x="0" y="0" width="1" height="1">
    <feTurbulence type="fractalNoise" baseFrequency=".02 .9" numOctaves="2" seed="7" result="f"/>
    <feColorMatrix in="f" type="matrix" values="0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .35 -.05" result="fg"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="11" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .25  0 0 0 0 .18  0 0 0 0 .1  0 0 0 .25 0" result="ng"/>
    <feMerge result="m"><feMergeNode in="fg"/><feMergeNode in="ng"/></feMerge>
    <feComposite in="m" in2="SourceAlpha" operator="in" result="mm"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="mm"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="soft4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="hl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs>`;

// ---------- corner-wrapped sticker halves (Nasomatto-style placement) ----------
// each half is 170 x 88 in real face units; the left half ends exactly at the bottle's front corner
const INK = "#4a3020", RULE = "#a48c66";
function emb(txt, x, y, size, ls, anchor = "start") {
  return `
    <text x="${x + .8}" y="${y + 1}" text-anchor="${anchor}" class="didot" font-size="${size}" letter-spacing="${ls}" fill="#7d6644" fill-opacity=".55">${txt}</text>
    <text x="${x - .7}" y="${y - .7}" text-anchor="${anchor}" class="didot" font-size="${size}" letter-spacing="${ls}" fill="#fffaf0">${txt}</text>
    <text x="${x}" y="${y}" text-anchor="${anchor}" class="didot" font-size="${size}" letter-spacing="${ls}" fill="#e0d2b5">${txt}</text>`;
}
const SW = 204, SH = 104, SY = -222;   // sticker half size + top position on the face
function stickerLeft(vol = "50 ml") {
  return `<g>
    <rect x="1.4" y="2" width="${SW}" height="${SH}" fill="#4f3c22" opacity=".22" filter="url(#hl)"/>
    <rect width="${SW}" height="${SH}" fill="#e9ddc6" filter="url(#paper)"/>
    ${emb("KORO", 16, 40, 32, 7)}
    <line x1="16" y1="51" x2="${SW - 12}" y2="51" stroke="${INK}" stroke-width="1"/>
    <text x="16" y="70" class="sans" font-size="11.5" fill="${INK}">natural eau de parfum</text>
    <text x="16" y="88" class="sans" font-size="10.5" fill="#7c6547">${vol} · Autumn 26</text>
  </g>`;
}
function stickerRight(scent = "MABON") {
  return `<g>
    <rect x="1.4" y="2" width="${SW}" height="${SH}" fill="#4f3c22" opacity=".22" filter="url(#hl)"/>
    <rect width="${SW}" height="${SH}" fill="#e9ddc6" filter="url(#paper)"/>
    <line x1="0" y1="12" x2="0" y2="${SH - 12}" stroke="${RULE}" stroke-width=".8"/>
    <text x="16" y="62" class="didot" font-size="24" letter-spacing="1" fill="${INK}">${scent}</text>
    <image href="line-art.png" x="132" y="12" width="62" height="70" preserveAspectRatio="xMidYMid meet" opacity=".92"/>
    <text x="${SW - 8}" y="${SH - 9}" text-anchor="end" class="sans" font-size="5.6" letter-spacing=".7" fill="#8b7656">ART · NADYA DANYLENKO</text>
  </g>`;
}

// ---------- the square bottle, turned so a corner faces the viewer ----------
// real face 360 wide x 380 high (KORO's existing bottle); E = how much of the top we see
const E = .12, R2 = Math.SQRT1_2;
function glassFace(side) {
  const W = 360, H = 380, base = 58, wall = 16;
  const shade = side === "right";
  return `
    <rect x="0" y="${-H}" width="${W}" height="${H}" fill="url(#glassFront)"/>
    <rect x="${wall}" y="${-H + 22}" width="${W - 2 * wall}" height="${H - 22 - base}" fill="url(#liquid)" opacity=".93"/>
    <rect x="${wall}" y="${-H + 22}" width="${W - 2 * wall}" height="${H - 22 - base}" fill="url(#liquidEdge)"/>
    <rect x="${wall}" y="${-H + 22}" width="${W - 2 * wall}" height="5" fill="#f6e4ad" opacity=".85"/>
    <rect x="2" y="${-base}" width="${W - 4}" height="${base - 2}" fill="url(#glassBase)"/>
    <path d="M${wall} ${-base} H${W - wall}" stroke="#fff6dc" stroke-width="2" opacity=".8"/>
    <rect x="0" y="${-H}" width="${wall}" height="${H}" fill="#fff" opacity=".12"/>
    <rect x="${W - wall}" y="${-H}" width="${wall}" height="${H}" fill="#fff" opacity=".12"/>
    ${shade ? "" : `<rect x="40" y="${-H + 20}" width="14" height="${H - 90}" fill="#fff" opacity=".4" filter="url(#hl)"/>
      <rect x="62" y="${-H + 34}" width="3" height="${H - 130}" fill="#fff" opacity=".55"/>`}
    ${shade ? `<rect x="${W - 40}" y="${-H + 30}" width="6" height="${H - 110}" fill="#fff" opacity=".25" filter="url(#hl)"/>` : ""}
    ${side === "left" ? `<g transform="translate(${W - SW} ${SY})">${stickerLeft()}</g>` : `<g transform="translate(0 ${SY})">${stickerRight()}</g>`}
    ${shade ? `<rect x="0" y="${-H}" width="${W}" height="${H}" fill="#4a2e0c" opacity=".14"/>` : ""}`;
}
function bottle(x, y, s) {
  const H = 380, L = 180 * Math.SQRT2, F = E * L;
  const top = -H;
  return `
  <g transform="translate(${x} ${y}) scale(${s})">
    <g transform="matrix(1 ${E} 0 1 ${-L} 0) scale(${R2} 1)">${glassFace("left")}</g>
    <g transform="matrix(1 ${-E} 0 1 0 ${F}) scale(${R2} 1)">${glassFace("right")}</g>
    <!-- top face -->
    <path d="M${-L} ${top} L0 ${top + F} L${L} ${top} L0 ${top - F} Z" fill="#f4eee0" opacity=".55"/>
    <path d="M${-L * .88} ${top} L0 ${top + F * .88} L${L * .88} ${top} L0 ${top - F * .88} Z" fill="#e7cf8c" opacity=".45"/>
    <path d="M${-L} ${top} L0 ${top - F} L${L} ${top}" fill="none" stroke="#fffaf0" stroke-width="1.4" opacity=".8"/>
    <!-- front corner edge -->
    <line x1="0" y1="${top + F}" x2="0" y2="${SY + F - 2}" stroke="#fffaf0" stroke-width="2.4" opacity=".75"/>
    <line x1="0" y1="${SY + SH + F + 2}" x2="0" y2="${F}" stroke="#fffaf0" stroke-width="2.4" opacity=".75"/>
    <line x1="0" y1="${SY + F}" x2="0" y2="${SY + SH + F}" stroke="#8b7656" stroke-width=".8" opacity=".35"/>
    <!-- outline -->
    <path d="M${-L} 0 L0 ${F} L${L} 0 V${top} L0 ${top - F} L${-L} ${top} Z" fill="none" stroke="#6b5530" stroke-opacity=".38" stroke-width="1.3"/>
    <path d="M${-L} ${top} L0 ${top + F} L${L} ${top}" fill="none" stroke="#6b5530" stroke-opacity=".3" stroke-width="1"/>
    ${sprayer(0, top)}
  </g>`;
}
function sprayer(cx, topY) {
  return `
    <ellipse cx="${cx}" cy="${topY}" rx="58" ry="7" fill="#d9c79c" opacity=".6"/>
    <rect x="${cx - 50}" y="${topY - 18}" width="100" height="18" fill="url(#gold)"/>
    <ellipse cx="${cx}" cy="${topY}" rx="50" ry="5" fill="url(#gold)"/>
    <rect x="${cx - 42}" y="${topY - 52}" width="84" height="36" fill="url(#gold)"/>
    <ellipse cx="${cx}" cy="${topY - 18}" rx="50" ry="5" fill="url(#goldTop)"/>
    <rect x="${cx - 34}" y="${topY - 100}" width="68" height="50" fill="url(#gold)"/>
    <ellipse cx="${cx}" cy="${topY - 52}" rx="42" ry="4.5" fill="url(#goldTop)"/>
    <ellipse cx="${cx}" cy="${topY - 100}" rx="34" ry="5" fill="url(#goldTop)"/>
    <circle cx="${cx + 14}" cy="${topY - 78}" r="3.4" fill="#5b4318"/>`;
}

// ---------- rigid kraft box, front-on, Nadya's drawing printed on the lid ----------
function boxFace(w, h, scent = "MABON") {
  const artW = w * .74, artH = artW * 715 / 595;
  return `
    <image href="embrace-art.png" x="${(w - artW) / 2}" y="${-h + h * .07}" width="${artW}" height="${artH}" opacity=".78" style="mix-blend-mode:multiply"/>
    <text x="${w / 2 + .6}" y="${-h * .17 + .8}" text-anchor="middle" class="didot" font-size="${w * .12}" letter-spacing="${w * .03}" fill="#fff0d6" opacity=".35">KORO</text>
    <text x="${w / 2}" y="${-h * .17}" text-anchor="middle" class="didot" font-size="${w * .12}" letter-spacing="${w * .03}" fill="#3b2716" opacity=".88">KORO</text>
    <line x1="${w * .2}" y1="${-h * .17 + 9}" x2="${w * .8}" y2="${-h * .17 + 9}" stroke="#3b2716" stroke-opacity=".7"/>
    <text x="${w / 2}" y="${-h * .17 + 24}" text-anchor="middle" class="sans" font-size="${w * .034}" letter-spacing="1" fill="#3b2716" opacity=".8">${scent} · natural eau de parfum · 50 ml</text>`;
}
function closedBox(x, y, w, h, scent = "MABON") {
  const t = w * .072, i = w * .067, baseBand = 14;
  return `
  <g transform="translate(${x} ${y})">
    <rect x="3" y="${-baseBand}" width="${w - 6}" height="${baseBand}" fill="#a98458" filter="url(#kraft)"/>
    <line x1="3" y1="${-baseBand}" x2="${w - 3}" y2="${-baseBand}" stroke="#5e4428" stroke-opacity=".5"/>
    <rect x="0" y="${-h}" width="${w}" height="${h - baseBand}" fill="url(#kraftFront)" filter="url(#kraft)"/>
    <path d="M0 ${-h} L${i} ${-h - t} H${w - i} L${w} ${-h} Z" fill="url(#kraftTop)" filter="url(#kraft)"/>
    <path d="M0 ${-h} H${w}" stroke="#f0dcbc" stroke-width="1.2" opacity=".8"/>
    <rect x="0" y="${-h}" width="${w}" height="${h - baseBand}" fill="none" stroke="#5e4428" stroke-opacity=".35"/>
    <rect x="0" y="${-h}" width="5" height="${h - baseBand}" fill="#fff" opacity=".12"/>
    <rect x="${w - 6}" y="${-h}" width="6" height="${h - baseBand}" fill="#3d2a14" opacity=".12"/>
    ${boxFace(w, h + 6, scent)}
  </g>`;
}
function lid(x, y, w, h, scent) {
  const t = w * .072, i = w * .067;
  return `
  <g transform="translate(${x} ${y})">
    <rect x="0" y="${-h}" width="${w}" height="${h}" fill="url(#kraftFront)" filter="url(#kraft)"/>
    <path d="M0 ${-h} L${i} ${-h - t} H${w - i} L${w} ${-h} Z" fill="url(#kraftTop)" filter="url(#kraft)"/>
    <rect x="0" y="${-h}" width="${w}" height="${h}" fill="none" stroke="#5e4428" stroke-opacity=".35"/>
    <rect x="${w - 6}" y="${-h}" width="6" height="${h}" fill="#3d2a14" opacity=".12"/>
    ${boxFace(w, h - 8, scent)}
  </g>`;
}

// ---------- open base tray, corner-on to match the bottle ----------
// a = half the tray's inner side (real units), h = wall height
function trayBack(x, y, s, a, h) {
  const L = a * Math.SQRT2, F = E * L, top = -h;
  return `
  <g transform="translate(${x} ${y}) scale(${s})">
    <path d="M${-L} ${top} L0 ${top + F} L${L} ${top} L0 ${top - F} Z" fill="#c9a77a" filter="url(#kraft)"/>
    <path d="M${-L * .95} ${top} L0 ${top + F * .95} L${L * .95} ${top} L0 ${top - F * .95} Z" fill="url(#kraftInside)"/>
  </g>`;
}
function trayFront(x, y, s, a, h) {
  const L = a * Math.SQRT2, F = E * L, wReal = 2 * a;
  const face = (shade) => `
    <rect x="0" y="${-h}" width="${wReal}" height="${h}" fill="url(#kraftFront)" filter="url(#kraft)"/>
    <path d="M0 ${-h} H${wReal}" stroke="#f0dcbc" stroke-width="1.6" opacity=".85"/>
    ${shade ? `<rect x="0" y="${-h}" width="${wReal}" height="${h}" fill="#3d2a14" opacity=".16"/>` : ""}`;
  return `
  <g transform="translate(${x} ${y}) scale(${s})">
    <g transform="matrix(1 ${E} 0 1 ${-L} 0) scale(${R2} 1)">${face(false)}
      <text x="${wReal / 2}" y="${-h / 2 + 7}" text-anchor="middle" class="didot" font-size="22" letter-spacing="7" fill="#5e4428" opacity=".55">KORO</text></g>
    <g transform="matrix(1 ${-E} 0 1 0 ${F}) scale(${R2} 1)">${face(true)}</g>
    <path d="M${-L} 0 L0 ${F} L${L} 0 V${-h} L0 ${-h + F} L${-L} ${-h} Z" fill="none" stroke="#5e4428" stroke-opacity=".4"/>
    <line x1="0" y1="${-h + F}" x2="0" y2="${F}" stroke="#f0dcbc" stroke-opacity=".6"/>
  </g>`;
}

// object shadow helpers: floor shadow toward back-right + wall shadow
function floorShadow(x0, x1, y, len, depth = 1) {
  return `<path d="M${x0} ${y} L${x1} ${y} L${x1 + len} ${y - len * .32} L${x0 + len * .9} ${y - len * .32} Z" fill="#5a4022" opacity="${.3 * depth}" filter="url(#soft)"/>
          <ellipse cx="${(x0 + x1) / 2}" cy="${y + 2}" rx="${(x1 - x0) * .56}" ry="7" fill="#3d2a14" opacity=".35" filter="url(#soft2)"/>`;
}

function room(W, H, horizon) {
  return `
    <rect width="${W}" height="${horizon}" fill="url(#wall)"/>
    <rect width="${W}" height="${horizon}" fill="url(#wallLight)"/>
    <rect y="${horizon}" width="${W}" height="${H - horizon}" fill="url(#floor)"/>
    <rect y="${horizon - 2}" width="${W}" height="6" fill="#bda781" opacity=".5" filter="url(#soft2)"/>
    <rect width="${W}" height="${H}" fill="#5a4022" opacity=".035" filter="url(#paper)"/>`;
}

// warm window light falling on the wall
function sun(x, y, w, h) {
  return `<g opacity=".55" filter="url(#soft)">
    <path d="M${x} ${y} L${x + w} ${y + 30} L${x + w - 40} ${y + h} L${x - 30} ${y + h - 20} Z" fill="#fff4dc"/>
    <path d="M${x + w * .48} ${y + 10} L${x + w * .52} ${y + 14} L${x + w * .46} ${y + h} L${x + w * .42} ${y + h - 4} Z" fill="#d9c9ab"/>
  </g>`;
}

// ---------- scenes ----------
function scene1() {
  const W = 800, H = 800, hz = 540, s = .92, bx = 400, by = 640;
  const L = 180 * Math.SQRT2 * s;
  return `<svg class="scene" id="s1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="1600" height="1600">${DEFS}
    ${room(W, H, hz)}
    ${sun(60, 70, 300, 330)}
    ${floorShadow(bx - L + 20, bx + L - 10, by + 14, 230)}
    <ellipse cx="${bx + L * .8}" cy="${by - 6}" rx="90" ry="20" fill="#e2a74a" opacity=".38" filter="url(#soft)"/>
    ${bottle(bx, by, s)}
  </svg>`;
}

function scene2() {
  const W = 1000, H = 750, hz = 520;
  const s = .6, L = 180 * Math.SQRT2 * s;
  const boxW = 270, boxH = 360, boxX = 170, by = 640, botX = 690;
  return `<svg class="scene" id="s2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="2000" height="1500">${DEFS}
    ${room(W, H, hz)}
    ${sun(40, 60, 380, 380)}
    ${floorShadow(boxX + 4, boxX + boxW - 4, by, 260)}
    ${floorShadow(botX - L + 10, botX + L - 6, by + 22, 170, .9)}
    <ellipse cx="${botX + L * .8}" cy="${by + 6}" rx="60" ry="13" fill="#e2a74a" opacity=".38" filter="url(#soft)"/>
    ${closedBox(boxX, by, boxW, boxH)}
    ${bottle(botX, by + 10, s)}
  </svg>`;
}

function scene3() {
  const W = 1000, H = 750, hz = 520;
  const s = .6, a = 196, trayH = 72, tx = 650, ty = 650;
  const L = a * Math.SQRT2 * s;
  const lidX = 140, lidY = 600, boxW = 270, boxH = 360;
  return `<svg class="scene" id="s3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="2000" height="1500">${DEFS}
    ${room(W, H, hz)}
    ${sun(30, 50, 380, 380)}
    <g transform="translate(${lidX} ${lidY}) scale(.9) translate(${-lidX} ${-lidY})">
      ${floorShadow(lidX + 6, lidX + boxW - 6, lidY, 250)}
      ${lid(lidX, lidY, boxW, boxH, "MABON")}
    </g>
    ${floorShadow(tx - L + 10, tx + L - 6, ty + 16, 220)}
    ${trayBack(tx, ty, s, a, trayH)}
    ${bottle(tx, ty - 6 * s, s)}
    ${trayFront(tx, ty, s, a, trayH)}
  </svg>`;
}

document.getElementById("out").innerHTML = scene1() + scene2() + scene3();
</script>
</body>
</html>
